<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선 역사 연습장</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--sub:#667085;--line:#e3e6ef;--pri:#4f46e5;--priTx:#fff;--ok:#16a34a;--okBg:#e8f7ee;--no:#dc2626;--noBg:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1c1f2a;--tx:#eef0f6;--sub:#9aa3b5;--line:#2c3040;--pri:#818cf8;--priTx:#10121a;--ok:#4ade80;--okBg:#12301f;--no:#f87171;--noBg:#3a1818;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1c1f2a;--tx:#eef0f6;--sub:#9aa3b5;--line:#2c3040;--pri:#818cf8;--priTx:#10121a;--ok:#4ade80;--okBg:#12301f;--no:#f87171;--noBg:#3a1818;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font-size:13px;font-weight:600}
.tabs button.on{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--sub);margin:10px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--priTx);font-size:16px;font-weight:700;margin-top:14px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-size:14px;font-weight:600}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px}
.q{font-size:18px;font-weight:700;margin:6px 0 14px;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;word-break:keep-all}
.opt.ok{background:var(--okBg);border-color:var(--ok)}
.opt.no{background:var(--noBg);border-color:var(--no)}
.fb{padding:12px;border-radius:10px;margin-top:6px;font-size:14px;word-break:keep-all}
.fb.ok{background:var(--okBg)}.fb.no{background:var(--noBg)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.low{background:var(--no)}
.row{display:flex;justify-content:space-between;font-size:14px}
.sub{color:var(--sub);font-size:13px}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;word-break:keep-all}
.item:last-child{border:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;margin-right:4px;background:var(--line);color:var(--sub)}
.tag.ok{background:var(--okBg);color:var(--ok)}.tag.no{background:var(--noBg);color:var(--no)}
.k{color:var(--pri);font-weight:700}
.big{font-size:32px;font-weight:800;text-align:center;margin:8px 0}
</style>
</head>

<script>
var KEY='joseon-v1',store={h:{}};

var CAT={A:'조선 건국',B:'통치 체제',C:'대외 관계',D:'사림·붕당 형성',E:'임진왜란',F:'호란·광해군',G:'후기 정치 변동'};
var k=function(x){return '<span class="k">'+x+'</span>'};
var NOTE={
A:['p.116~117','<span class="k">건국 세력</span>: 이성계와 급진파 사대부 주도<br><span class="k">위화도 회군(1388)</span>: 이성계 권력 장악 → 정도전 등 급진파 사대부와 개혁 추진<br><span class="k">과전법(1391)</span>: 전·현직 관료, 경기 지역 토지에 수조권 설정 → 국가 재정 확보, 신진 사대부의 경제 기반 마련<br><span class="k">조선 건국(1392)</span>: 정몽주 등 온건파 사대부 제거, 국호 ‘조선’(고조선 계승)<br><span class="k">한양 천도(1394)</span>: 한반도 중앙, 한강(육로·수로 교통 편리), 산으로 둘러싸여 외적 방어에 유리<br><span class="k">통치 이념</span>: 성리학 / 정도전은 재상 중심 정치와 왕도 정치 강조<br><span class="k">의의</span>: 개인의 유교적 지식·교양 중시, 불교 위축·유교 윤리가 중심<br><span class="k">태종</span>: 왕자의 난으로 즉위, 사병 혁파(군사권 장악), 호적 조사·호패법<br><span class="k">세종</span>: 집현전, 의정부 권한 강화, 경연, 세금 제도 정비, 훈민정음 반포<br><span class="k">세조</span>: 단종을 몰아내고 즉위, 집현전 폐지·경연 중단, 의정부 권한 축소, 직전법, 『경국대전』 편찬 시작<br><span class="k">성종</span>: 홍문관 설치, 경연 재개, 『경국대전』 완성 → 유교 중심 통치 질서 확립'],
B:['p.118~119','<span class="k">의정부</span>: 영의정 등 3정승이 합의하여 국정 총괄<br><span class="k">6조</span>: 이조(문관 인사)·호조(국세 파악, 세금 징수)·예조(교육·과거·외교·제사)·병조(무관 인사, 국방)·형조(형벌·소송)·공조(산림·건설·수공업)<br><span class="k">승정원</span>: 국왕의 비서 역할 / <span class="k">의금부</span>: 국가의 중대한 죄인을 다스림<br><span class="k">3사</span>: 사헌부(감찰)·사간원(간쟁)·홍문관(정책 자문, 경연 담당)<br><span class="k">기타</span>: 춘추관(역사서 편찬·보관), 성균관(유학 교육), 한성부(수도 행정·치안)<br><span class="k">지방 행정</span>: 전국을 8도로 나누고 아래에 부·목·군·현<br>· <span class="k">관찰사</span>: 각 도에 파견, 수령 지휘·감독<br>· <span class="k">수령</span>: 모든 군현에 파견, 행정·사법·군사 업무 총괄<br>· <span class="k">향리</span>: 수령의 실무 보좌<br>· <span class="k">유향소</span>: 지방 양반의 자치 기구, 수령 자문·향리 비리 감찰'],
C:['p.120~121','<span class="k">사대</span>: 큰 나라를 섬김 / <span class="k">교린</span>: 이웃 나라와 대등한 의례<br><span class="k">명과의 관계</span>: 건국 초 태조의 요동 정벌 추진(명과 대립) → 태종 이후 친선, 사대 관계 확립<br><span class="k">교류</span>: 해마다 사신·조공품(말, 인삼 등), 답례품(약재, 서적 등) / 이점: 선진 문물, 왕권 안정, 국제적 지위 확보<br><span class="k">여진</span>: 회유책(무역소 설치, 귀화 장려·관직·토지 수여) / 강경책(세종 때 최윤덕 4군, 김종서 6진 → 오늘날 국경선 확정)<br><span class="k">일본</span>: 회유책(3포 개항: 제포·부산포·염포) / 강경책(세종 때 이종무 대마도 토벌)<br><span class="k">동남아시아·류큐</span>: 시암(태국)·자와(인도네시아)·류큐(오키나와)와 교류, 토산품 ↔ 문방구·불경·유교 경전'],
D:['p.123~126','<span class="k">훈구</span>: 조선 건국·세조 즉위를 도운 공신, 많은 토지·노비 소유, 왕실과 혼인, 권력 독점<br><span class="k">사림</span>: 건국에 불참, 지방에서 학문·교육, 정몽주·길재 학통, 왕도 정치·향촌 자치 / 성종이 훈구 견제 위해 김종직 등 등용, 주로 3사 언관직<br><span class="k">사화</span>(네 차례): 무오(연산군, 김종직의 조의제문)·갑자(연산군, 친어머니 폐위 관련)·기묘(중종, 조광조의 급진적 개혁에 부담)·을사(명종, 외척 간 권력 다툼)<br><span class="k">조광조</span>: 소격서 폐지, 현량과 실시, 부당한 공신 자격 박탈 주장<br><span class="k">서원</span>: 중종 때 주세붕 백운동 서원 → 명종 때 소수서원(최초 사액 서원), 제사·성리학 연구·교육, 여론 형성<br><span class="k">향약</span>: 향촌 자치 규약, 사림이 여씨향약 번역·보급, 이황·이이가 우리 실정에 맞게 시행<br><span class="k">사림 집권</span>: 선조 때 주도권, 공론은 3사가 주도<br><span class="k">붕당 형성</span>: 이조 전랑 자리 갈등 → 동인(이황·조식, 영남 → 남인·북인)과 서인(이이·성혼, 경기·충청)<br><span class="k">붕당의 특징</span>: 상대 붕당 존중, 학문적 차이 인정, 상호 비판과 견제'],
E:['p.135~137','<span class="k">16세기 중반 정세</span>: 조선(양반 분열·군역 문란, 국방력 약화), 명(환관 횡포, 몽골·왜구 침입), 일본(도요토미 히데요시의 전국 시대 통일 → 대륙 진출 위해 조선 침략 준비)<br><span class="k">발발(1592)</span>: 부산진·동래성 함락 → 충주 전투 패배 → 선조 의주 피란·명에 지원 요청 → 한성·평양 함락<br><span class="k">의병</span>: 유생·농민·승려, 지리 활용, 육상 보급로 차단<br><span class="k">수군</span>: 옥포·사천·당포·한산도 승리 → 제해권 장악, 곡창 지대 수호, 해상 보급로 차단<br><span class="k">극복</span>: 명 지원군, 평양성 탈환, 진주성(김시민)·행주산성(권율) 승리 → 일본 휴전 제안<br><span class="k">정유재란(1597)</span>: 휴전 협상 결렬 → 재침략, 명량 해전 승리, 도요토미 사망·일본군 철수, 노량 해전 → 전쟁 종결(1598)<br><span class="k">영향</span>: 조선(토지 황폐화, 재정·인구 감소, 신분 질서 혼란, 문화유산 약탈·소실, 철포·담배 전래), 중국(명 약화, 여진 성장)'],
F:['p.138~139','<span class="k">광해군</span>: 토지 대장·호적 정비, 성곽·무기 수리 / 중립 외교(명 쇠퇴, 후금 건국 → 강홍립 원군 파견 → 후금에 항복) → 후금과의 전쟁 피함<br><span class="k">인조반정(1623)</span>: 영창 대군 사살·인목 대비 폐위 문제로 서인과 대립 → 서인이 광해군을 몰아내고 인조 추대<br><span class="k">정묘호란(1627)</span>: 인조·서인의 친명배금 → 후금 침략, 황해도까지 진격 → 인조 강화도 피신 → 형제 관계 화의, 후금 철수<br><span class="k">병자호란(1636)</span>: 후금이 군신 관계 요구 → 주화론·척화론 대립(척화론 우세) → 청 건국·침입 → 인조 남한산성 피신 → 주화론 우세 → 삼전도에서 굴욕적 화의 / 왕자·신하·백성 인질, 공물<br><span class="k">북벌론</span>: 청 정벌 주장, 효종이 성곽·무기 정비·군대 양성 → 백성 생활고, 효종 죽음으로 중단<br><span class="k">북학론</span>: 청과 교류, 청의 문물 수용 주장'],
G:['p.145~146','<span class="k">비변사</span>: 중종 때 왜구·여진 대비 임시 회의 기구 → 양난 후 최고 통치 기구(군사·외교·재정·인사 총괄) → 의정부·6조 기능 축소, 왕권 약화<br><span class="k">군사</span>: 훈련도감(직업 군인) → 5군영 개편, 속오군(양반~노비, 평상시 생업, 유사시 전투)<br><span class="k">조세</span>: 전세=영정법(토지 1결당 쌀 4두 고정), 공납=대동법(토지 결수 기준 쌀·옷감·동전), 군역=균역법(군포 1필)<br><span class="k">붕당 전개</span>: 선조 때 서인·동인 → 광해군 때 북인 집권 → 인조반정 후 서인 주도·남인 참여, 상호 비판·견제, 3사·서원으로 공론 형성<br><span class="k">예송</span>: 현종 때, 상복 입는 기간 → 효종 정통성 문제, 서인·남인 대립<br><span class="k">환국</span>: 숙종 때, 집권 붕당 급격 교체·보복 → 서인이 노론·소론으로 분화, 숙종의 탕평책 실패']
};
var qs=[
['하','A','조선 건국을 주도한 세력은?',['이성계와 급진파 사대부','이성계와 온건파 사대부','정몽주와 길재','훈구와 사림'],'이성계와 정도전 등 급진파 사대부가 주도했어요.'],
['하','A','전·현직 관료에게 경기 지역 토지의 수조권을 준 제도는?',['과전법','직전법','영정법','대동법'],'1391년 과전법으로 국가 재정을 확보하고 신진 사대부의 경제 기반을 마련했어요.'],

var id=sess.ids[sess.i],q=Q[id],h='<div class="card"><div class="meta"><span><span class="tag">'+q[0]+'</span><span class="tag">'+CAT[q[1]]+'</span>'+(q[6]?'<span class="tag">AI</span>':'')+'</span><span>'+(sess.i+1)+' / '+sess.ids.length+'</span></div><div class="q">'+q[2]+'</div>';
sess.order.forEach(function(oi,k){var cls='';if(sess.pick!==null){if(oi===q[4])cls=' ok';else if(k===sess.pick)cls=' no'}
h+='<button class="opt'+cls+'" onclick="ans('+k+')">'+(k+1)+'. '+q[3][oi]+'</button>'});
if(sess.pick!==null){var r=sess.order[sess.pick]===q[4];h+='<div class="fb '+(r?'ok':'no')+'"><b>'+(r?'정답!':'오답')+'</b> '+(r?'':'정답: '+q[3][q[4]]+'<br>')+q[5]+'</div><button class="btn" onclick="next()">'+(sess.i+1>=sess.ids.length?'결과 보기':'다음 문제')+'</button>'}
return h+'</div>'}
var gs={busy:false,msg:''};
function reuse(w){cfg.mode=w?'wrong':'new';cfg.n=20;gs.msg='';start()}
async function genStart(){
if(gs.busy)return;gs.busy=true;gs.msg='';render();var newIds=[],errs=[],cands=[],add=0;
try{
if(!window.claude||!claude.use){gs.msg='이 화면에서는 AI 문제 만들기를 쓸 수 없어요. 클로드 링크로 열어 주세요.';return}
var sample=await claude.use('sample');
if(!sample){gs.msg='이 화면에서는 AI 문제 만들기를 쓸 수 없어요. 클로드 링크로 열어 주세요.';return}
var keys=cfg.cat==='전체'?Object.keys(CAT):[cfg.cat];
var facts=keys.map(function(c){return '['+c+' '+CAT[c]+'] '+NOTE[c][1].replace(/<[^>]+>/g,' ')}).join('\n');
var lv=cfg.lvl==='전체'?'하·중·상을 골고루 섞어서':'난이도 ‘'+cfg.lvl+'’로';
var ct=cfg.cat==='전체'?'여러 범위를 골고루 섞어서':'범위 '+cfg.cat+'('+CAT[cfg.cat]+')만';
var seen=Q.map(function(q){return q[2]}).slice(-40).join(' / ');
var p='너는 한국 중학교 3학년 역사 ‘조선의 성립과 발전’, ‘조선 사회의 변동’ 단원을 가르치는 출제 교사야. 아래 학습지 내용을 근거로 '+lv+', '+ct+' 객관식 10문제를 만들어.\n규칙:\n- 학습지 내용과 중학교 역사 교과서 기준으로 정답이 하나로 분명한 문제만 낸다.\n- 난이도 하는 용어·인물·제도 기본 확인, 중은 사건의 순서·원인·결과나 개념 구별, 상은 비슷한 개념을 섞은 함정이나 ‘틀린 것 고르기’.\n- 선택지는 3~4개, ans는 정답의 0부터 시작하는 번호, expl은 근거를 짧게(1~2문장).\n- 정답을 두 번 검산하고 불확실한 문제는 버린다.\n- 아래 기존 문제와 겹치지 않게 한다: '+seen+'\n[학습지 내용]\n'+facts+'\n반드시 JSON 배열만 출력해. 각 원소: {"lvl":"하|중|상","cat":"'+keys.join('|')+'","q":"문제","opts":["..."],"ans":0,"expl":"해설"}';
var rs=await Promise.all([0,1].map(function(i){return sample.json(p+(i?'\n이번에는 문제 형식을 다양하게(순서 배열, 틀린 것 고르기, 인물·사건 연결 등) 해.':'\n이번에는 사건의 원인·결과와 용어의 뜻 중심으로 해.'),{modelTier:'default',cache:false}).catch(function(e){errs.push(e);return []})}));
var arr=[];rs.forEach(function(r){arr=arr.concat(Array.isArray(r)?r:(r&&(r.questions||r.items))||[])});
arr.forEach(function(x){if(!x||(cfg.lvl==='전체'&&['하','중','상'].indexOf(x.lvl)<0)||(cfg.cat==='전체'&&!CAT[x.cat])||typeof x.q!=='string'||!Array.isArray(x.opts)||x.opts.length<2||x.opts.length>4||typeof x.expl!=='string')return;
if(!(Number.isInteger(x.ans)&&x.ans>=0&&x.ans<x.opts.length))return;
if(Q.some(function(q){return q[2]===x.q}))return;if(new Set(x.opts.map(String)).size!==x.opts.length)return;
cands.push([cfg.lvl==='전체'?x.lvl:cfg.lvl,cfg.cat==='전체'?x.cat:cfg.cat,x.q,x.opts.map(String),x.ans,x.expl,'AI'])});
cands=await verify(sample,cands);cands.forEach(function(g){Q.push(g);store.gen.push(g);newIds.push(Q.length-1);add++});
if(add){save();var ids=shuf(newIds);if(ids.length<20){var pp=pool().filter(function(i){return newIds.indexOf(i)<0});pp=shuf(pp.filter(function(i){return !store.h[i]})).concat(shuf(pp.filter(function(i){return store.h[i]})));ids=ids.concat(pp)}sess={ids:ids.slice(0,20),i:0,ok:0,done:false,order:null,pick:null};gs.msg=''}else gs.msg=errs[0]&&errs[0].code==='not_granted'?'‘허용’을 눌러야 문제를 만들 수 있어요.':errs[0]&&errs[0].code==='rate_limited'?'잠시 뒤에 다시 해 주세요.':'AI가 문제를 제대로 만들지 못했어요. 한 번 더 눌러 보세요.';
}catch(e){gs.msg=e&&e.code==='not_granted'?'‘허용’을 눌러야 문제를 만들 수 있어요.':e&&e.code==='rate_limited'?'잠시 뒤에 다시 해 주세요.':'문제를 만들지 못했어요. 잠시 뒤 다시 해 보세요.'}
finally{gs.busy=false;render()}}
function fixE(q){if(!/몇 어절/.test(q[2]))return true;var m=q[2].match(/[“"](.+?)[”"]/);if(!m)return true;var n=m[1].trim().split(/\s+/).length;var k=q[3].findIndex(function(o){return parseInt(o,10)===n});if(k<0)return false;q[4]=k;return true}
async function verify(sample,c){
if(!c.length)return c;
try{var p='아래 한국사 문제 각각을 네가 직접 풀어서, 가장 알맞은 선택지 번호(0부터)만 답해. 중학교 역사 교과서 기준. 정답이 하나로 정해지지 않거나 문제가 이상하면 -1. 반드시 문제 순서대로 JSON 숫자 배열만 출력.\n'+c.map(function(g,i){return i+'. '+g[2]+' '+g[3].map(function(o,j){return j+')'+o}).join(' ')}).join('\n');
var r=await sample.json(p,{modelTier:'default',cache:false});
if(!Array.isArray(r)||r.length!==c.length)return c;
return c.filter(function(g,i){return r[i]===g[4]})}catch(e){return c}}
function noteV(){
var h='';Object.keys(CAT).forEach(function(c){h+='<div class="card"><b>'+CAT[c]+'</b> <span class="sub">'+NOTE[c][0]+'</span><div style="margin-top:6px;font-size:14px;word-break:keep-all">'+NOTE[c][1]+'</div></div>'});
return h+'<button class="btn" onclick="go(\'play\')">문제 풀러 가기</button>'}
function stat(f){var n=0,r=0;Object.keys(store.h).forEach(function(i){if(f(Q[i])){n+=store.h[i].n;r+=store.h[i].r}});return {n:n,r:r}}
function barR(name,s){var p=s.n?Math.round(s.r/s.n*100):0;return '<div class="row"><span>'+name+'</span><span class="sub">'+(s.n?p+'% ('+s.r+'/'+s.n+')':'아직 안 풀었어요')+'</span></div><div class="bar"><i class="'+(s.n&&p<60?'low':'')+'" style="width:'+p+'%"></i></div>'}
function anV(){var tot=stat(function(){return true});
if(!tot.n)return '<div class="card">아직 푼 문제가 없어요. 먼저 문제를 풀면 범위별·난이도별 정답률을 분석해 줄게요.</div>';
var h='<div class="card"><b>범위별 정답률</b><div style="height:8px"></div>',worst=null,wp=101;
Object.keys(CAT).forEach(function(c){var s=stat(function(q){return q[1]===c});h+=barR(CAT[c],s);if(s.n>=3){var p=s.r/s.n*100;if(p<wp){wp=p;worst=c}}});
h+='</div><div class="card"><b>난이도별 정답률</b><div style="height:8px"></div>';
['하','중','상'].forEach(function(l){h+=barR('난이도 '+l,stat(function(q){return q[0]===l}))});
h+='</div><div class="card"><b>진단</b><div style="margin-top:6px;font-size:14px">';
if(worst&&wp<80){h+='가장 약한 범위은 <b>'+CAT[worst]+'</b>('+Math.round(wp)+'%)이에요. 이 범위을 집중해서 풀어 볼까요?</div><button class="btn" onclick="cfg.cat=\''+worst+'\';cfg.lvl=\'전체\';cfg.mode=\'new\';go(\'play\')">'+CAT[worst]+' 연습하기</button>'}
else if(worst){h+='모든 범위이 안정적이에요! 난이도 ‘상’에 도전해 보세요.</div>'}
else h+='범위별로 3번 이상 풀면 더 정확하게 분석해 줄게요.</div>';
var wr=Object.keys(store.h).filter(function(i){return !store.h[i].last}).length;
if(wr)h+='<button class="btn ghost" onclick="cfg.mode=\'wrong\';cfg.cat=\'전체\';cfg.lvl=\'전체\';go(\'play\')">틀린 문제 '+wr+'개 다시 풀기</button>';
return h+'</div>'}
var logF='all',rst=false;
function logV(){var ids=Object.keys(store.h).sort(function(a,b){return store.h[b].ts-store.h[a].ts});
var h='<div class="card"><div class="chips"><button class="chip'+(logF==='all'?' on':'')+'" onclick="logF=\'all\';render()">전체 '+ids.length+'</button><button class="chip'+(logF==='wrong'?' on':'')+'" onclick="logF=\'wrong\';render()">오답노트</button></div></div>';
var list=ids.filter(function(i){return logF==='all'||!store.h[i].last});
if(!list.length)return h+'<div class="card">'+(ids.length?'틀린 문제가 없어요. 👍':'아직 푼 문제가 없어요.')+'</div>';
h+='<div class="card">';list.forEach(function(i){var q=Q[i],x=store.h[i];
h+='<div class="item"><span class="tag '+(x.last?'ok':'no')+'">'+(x.last?'정답':'오답')+'</span><span class="tag">'+q[0]+'</span><span class="tag">'+CAT[q[1]]+'</span><span class="sub">'+x.r+'/'+x.n+'회 정답</span><div style="margin-top:4px">'+q[2]+'</div><div class="sub">정답: '+q[3][q[4]]+'</div></div>'});
h+='</div><button class="btn ghost" onclick="reset()">'+(rst?'정말 지울까요? 한 번 더 누르세요':'기록 모두 지우기')+'</button>';return h}
function reset(){if(!rst){rst=true;render();return}Q.length=BASE;store={h:{},gen:[]};save();rst=false;render()}
function render(){tabsR();document.getElementById('v').innerHTML=view==='note'?noteV():view==='play'?playV():view==='an'?anV():logV()}
render();
</script>
